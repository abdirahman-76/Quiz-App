<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI-powered Quiz App</title>
    <link rel="stylesheet" href="quiz.css">
    <script src="quiz.js" defer></script>
</head>

<body>
    <h1>My AI Quiz App</h1>
    <p>Learn somthing new. Test what you know!</p>
    <main>
        <p id="questionNumber">Question 1 of 3</p>
        <progress id="quizProgress" value="0" max="3"></progress>
        <h2 id="question">Which language structures a webpage?</h2>
        <h2 id="question"></h2>
        <div id="answerButtons">

        </div>
        <p id="feedback"></p>
        <p id="score">Score:0</p>
        <p>Time:30 seconds</p>
        <button id="nextButton" disabled>Next Question</button>
        <button id="restartButton" hidden>Restart Quiz</button>
    </main>


</body>

</html>
